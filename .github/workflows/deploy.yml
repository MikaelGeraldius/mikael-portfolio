# Builds the Vite site and deploys ./dist to GitHub Pages.
#
# Not yet published: nothing runs until this repository exists on GitHub and
# Pages is set to "GitHub Actions" (Settings > Pages > Build and deployment > Source).
#
# Base path: vite.config.ts defaults to /mikael-portfolio/ (a project site at
# https://<user>.github.io/mikael-portfolio/). If the repository has another name,
# or the site uses a custom domain or a <user>.github.io repository, set BASE_PATH
# below (for example "/" or "/other-repo/").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Gives the site's public address (base_url), used for the absolute link-preview URLs.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          BASE_PATH: /mikael-portfolio/
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
