<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mikael Geraldius Gunawan · Informatics student, AI and web design</title>
    <meta
      name="description"
      content="Portfolio of Mikael Geraldius Gunawan, an Informatics student at Universitas Multimedia Nusantara looking for internship and job opportunities in AI and web design."
    />
    <!-- Link previews (LinkedIn, WhatsApp, Slack, X). %SITE_URL% is filled in at build time: see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Mikael Geraldius Gunawan · Informatics student, AI and web design" />
    <meta
      property="og:description"
      content="Informatics student at Universitas Multimedia Nusantara, looking for internships and jobs in AI and web design."
    />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mikael Geraldius Gunawan, Informatics student looking for work in AI and web design." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0e1115" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Gambarino-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Entrances only apply when script runs; if the app never starts, show everything.
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (!document.documentElement.classList.contains('ready')) {
          document.documentElement.classList.add('reveal-fallback')
        }
      }, 3000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
